# Config for the webserver + agent running on an edge machine.
# The policy server and infrastructure (NATS, TimescaleDB) run elsewhere.
# Replace <server-ip> with the policy server's IP address.

env = "prod"

[server]
port    = 4040   # HTTPS port (web UI)
altport = 80    # HTTP port — used for Let's Encrypt challenge and redirect to HTTPS
webdir  = "web/public"

# Remove altport and set lets_encrypt = false to run plain HTTP instead:
# port    = 4040
# altport = 8080   # not needed without Let's Encrypt

letsencrypt = false
contact     = ""              # your email for Let's Encrypt notifications
domains     = ["yourdomain.com"]

[nats]
# Replace <server-ip> with the policy server's IP address.
url = "nats://localhost:4222"

[agent]
interface = "enp0s5"    # set to the correct interface on this machine (ip link show)
agentid   = "agent-1"
serverurl = "http://localhost:8080"
topic     = "production"  # leave empty for all topics
