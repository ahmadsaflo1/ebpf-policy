version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: policy_metrics
      POSTGRES_USER: ebpf_user
      POSTGRES_PASSWORD: ebpf_secret_password
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - ebpf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebpf_user -d policy_metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:latest
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    networks:
      - ebpf-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ebpf-network

  policy-server:
    build:
      context: .
      dockerfile: Dockerfile.policyserver
    container_name: policy-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - POSTGRES_HOST=timescaledb
      - POSTGRES_USER=ebpf_user
      - POSTGRES_PASSWORD=ebpf_secret_password
      - POSTGRES_DB=policy_metrics
    volumes:
      - ./policyserver.conf:/etc/policyserver.conf:ro
    command: ["-c", "/etc/policyserver.conf"]
    ports:
      - "8080:8080"
    networks:
      - ebpf-network

volumes:
  timescaledb-data:
  grafana-data:

networks:
  ebpf-network:
    driver: bridge
