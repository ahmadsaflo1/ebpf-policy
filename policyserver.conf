# Config for the policy server (central control plane).
# Runs together with NATS, TimescaleDB, and Grafana (make start-infra).

env = "prod"

[server]
port = 8080   # REST API port

[nats]
url = "nats://localhost:4222"

[postgres]
host     = "localhost"
port     = 5432
user     = "ebpf_user"
password = "ebpf_secret_password"
db       = "policy_metrics"
